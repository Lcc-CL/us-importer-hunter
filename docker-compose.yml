name: us-importer-hunter

# Sprint 1 services: backend, frontend, postgres, redis (+ pgadmin via --profile tools).
# Later services (celery-worker, qdrant, nginx, flower) plug into the same
# network/volume pattern without changing existing services.

services:
  backend:
    build:
      context: ./apps/backend
      target: dev
    env_file:
      - path: .env
        required: false    # clean checkout boots on defaults; secrets only needed for real LLM calls
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./apps/backend/app:/app/app          # hot reload
      - ./apps/backend/tests:/app/tests
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  frontend:
    build:
      context: ./apps/frontend
      target: dev
      # NEXT_PUBLIC_* values are compiled into the client bundle, so the prod
      # target needs them at image-build time. The dev target reads them from
      # the environment below; passing both keeps the two targets consistent.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_ENABLE_RESEARCH: ${NEXT_PUBLIC_ENABLE_RESEARCH:-false}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # Research is an internal surface: off unless .env sets it to true.
      # The frontend deliberately has no env_file, so every variable it needs
      # is listed here rather than inherited from the backend's secrets.
      NEXT_PUBLIC_ENABLE_RESEARCH: ${NEXT_PUBLIC_ENABLE_RESEARCH:-false}
    volumes:
      - ./apps/frontend/src:/app/src          # hot reload
      - ./apps/frontend/public:/app/public
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    env_file:
      - path: .env
        required: false    # clean checkout boots on defaults; secrets only needed for real LLM calls
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-importer_hunter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-importer_hunter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]                       # dev only: docker compose --profile tools up
    env_file:
      - path: .env
        required: false    # clean checkout boots on defaults; secrets only needed for real LLM calls
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  app-network:
    driver: bridge
