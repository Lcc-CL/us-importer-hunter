[project]
name = "importer-hunter-backend"
version = "0.1.0"
description = "US Importer Hunter — AI-powered sales intelligence platform for freight forwarders (backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "openai>=1.40",
    "selectolax>=0.4.11",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated revisions are not hand-formatted
"app/database/migrations/versions/*" = ["E501", "F401", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The Stage 4A fixture matrices predate strict annotations. Production code and
# the PostgreSQL closure tests remain fully strict; these modules are still type-checked.
module = [
    "tests.services.test_cross_provider_dedup",
    "tests.services.test_entity_resolution",
    "tests.services.test_import_evidence_infra",
    "tests.services.test_importer_aggregate",
    "tests.services.test_quality_assessment",
    "tests.services.test_shipment_dedup",
]
disable_error_code = ["arg-type", "no-untyped-call", "no-untyped-def"]
