# Workflow specifications — v1 (Sprint 2 L3)
# Workflows orchestrate agents and services; see docs/workflow.md.
# Steps emit domain events (docs/business-domain.md) on the in-process
# EventBus (ADR-0004/0015); Execution context wraps every run in a Task.

workflows:
  bulk_import:
    package: app.workflows.bulk_import
    description: >
      D5a1 synchronous traceable raw CSV intake. Preflights a spooled upload
      without retaining the full file in memory, accepts utf-8-sig, utf-8 or
      gb18030, rejects files above 20 MB or 20,000 data rows before creating a
      session, and persists every accepted, invalid and duplicate row in batches
      of 500. The same source plus file SHA-256 returns the existing session.
      It never creates Company, Contact, Import Evidence, Opportunity, Research,
      ProspectBatch, Outreach or Draft records and invokes no provider or LLM.
    steps:
      - { id: preflight, service: streaming_csv_intake }
      - { id: create_session, aggregate: import_session }
      - { id: persist_raw_rows, aggregate: raw_import_row, batch_size: 500 }
      - { id: persist_terminal_statistics, aggregate: import_session }
    statuses: [receiving, processing, completed, partial_failed, failed]
    execution: sync_http
    limits: { max_bytes: 20971520, max_rows: 20000 }
    status: implemented

  import_entity_resolution:
    package: app.workflows.import_resolution
    description: >
      D5b1 background deterministic resolution from accepted RawImportRow data
      into canonical Company and Contact identities plus CompanyContact employment
      projections. Source plus external company ID is stable across files; domain,
      normalized name/address and contact channels are evaluated without LLM or
      external providers. Ambiguous company or contact candidates remain behind an
      auditable human-review gate and do not create CompanyContact links early.
      Processing uses an import-specific PostgreSQL job with lease, retry, heartbeat
      and stale recovery, and never creates Opportunity, Research, ProspectBatch,
      Outreach, Draft or Umail data.
    steps:
      - { id: project_raw_fields, service: raw_import_projector }
      - { id: resolve_company, service: deterministic_entity_matcher }
      - { id: resolve_contact, service: deterministic_entity_matcher }
      - { id: persist_decisions, aggregate: import_entity_decision }
      - { id: persist_employment, aggregate: company_contact, conditional: identity_confirmed }
      - { id: review_ambiguous_matches, workflow: import_entity_review, human_review: required }
    statuses: [pending, running, completed, partial_failed, failed]
    execution: postgresql_worker
    job_statuses: [pending, leased, running, completed, failed, cancelled]
    batch_size: 250
    status: implemented

  prospect_routing:
    package: app.workflows.prospect_routing
    description: >
      D5c background deterministic pre-score and sales-routing workflow for a
      completed or partial-failed ImportSession after entity resolution. It
      projects persisted RawImportRow, canonical Company, resolution-profile and
      CompanyContact facts into an auditable feature snapshot, applies the fixed
      d5c-deterministic-routing-v1 weights, and recommends A/B/C/D. Companies with
      unresolved identity review are blocked without stopping other companies.
      Human confirm, override or exclude is required before an effective-tier A
      company can enter a routing-sourced ProspectBatch of at most five companies.
      Creating that batch does not create a ProspectJob and never starts Research,
      Opportunity scoring, draft generation, Umail export or email delivery. No
      provider or LLM is invoked.
    steps:
      - { id: aggregate_features, service: routing_feature_projector }
      - { id: deterministic_pre_score, service: deterministic_prospect_routing_scorer }
      - { id: persist_routes, aggregate: prospect_route }
      - { id: review_routes, workflow: prospect_route_review, human_review: required }
      - { id: create_a_tier_batch, aggregate: prospect_batch, conditional: confirmed_effective_tier_a }
    statuses: [pending, running, completed, partial_completed, failed]
    route_review_statuses: [suggested, confirmed, overridden, blocked]
    tiers: [A, B, C, D]
    execution: postgresql_worker
    job_statuses: [pending, leased, running, completed, failed, cancelled]
    rules_version: d5c-deterministic-routing-v1
    limits: { companies_per_prospect_batch: 5, worker_concurrency: 1 }
    status: implemented

  discovery_task:
    package: app.workflows.discovery_task
    description: >
      D1 synchronous importer-discovery supervisor. Deterministically parses a
      Chinese goal, persists a generic execution Task plus DiscoveryTask detail,
      invokes one Company Discovery Provider, deduplicates candidates by domain
      then normalized name and address, and feeds non-duplicate claims through
      company_ingestion. Candidate failures are isolated and persisted. The
      default ImportYeti adapter fails closed until an official API contract is
      available with a machine-readable error code; manual_csv is an explicitly
      labelled development adapter with file-level validation before task creation.
    steps:
      - { id: parse_prompt, service: discovery_prompt_parser }
      - { id: search_provider, provider: company_discovery_provider }
      - { id: normalize_deduplicate, service: discovery_candidate_preparation }
      - { id: ingest_companies, workflow: company_ingestion, for_each: candidate }
      - { id: persist_terminal_status, aggregate: discovery_task }
    statuses: [pending, running, completed, partial_failed, failed]
    execution: sync
    status: implemented

  prospect_batch:
    package: app.workflows.prospect_batch
    description: >
      D3a background supervisor for at most five companies saved by a completed
      or partial_failed manual_csv Discovery Task. HTTP submission atomically
      persists a batch plus PostgreSQL execution job and returns 202. A separate
      single-job worker leases the job, updates heartbeats, and sequentially reuses
      website Research, deterministic Opportunity scoring, public website contact
      discovery, Contact ingestion, decision-maker selection and review-only draft
      generation. New Research claims always stop at awaiting_evidence_review;
      no claim is auto-confirmed. Once every claim is accepted or rejected, an
      explicit Resume submits another background execution without re-running
      completed stages. Expired leases are recovered without restarting human
      evidence review. No email is sent.
    steps:
      - { id: validate_companies, service: prospect_batch_preflight, for_each: company }
      - { id: research, workflow: research, for_each: company }
      - { id: evidence_gate, policy: human_review_required_for_new_claims }
      - { id: resume_after_review, workflow: prospect_batch, conditional: all_claims_reviewed }
      - { id: score, workflow: opportunity, conditional: trusted_company_evidence }
      - { id: discover_contact, service: website_contact_discovery, conditional: qualified }
      - { id: ingest_contact, workflow: contact_ingestion, conditional: contact_found }
      - { id: select_decision_maker, workflow: decision_maker, conditional: named_contact }
      - { id: generate_draft, workflow: email, conditional: draft_prerequisites }
    statuses: [pending, running, completed, partial_failed, failed]
    execution: postgresql_worker
    job_statuses: [pending, leased, running, completed, failed, cancelled]
    limits: { companies: 5, concurrency: 1 }
    status: implemented

  import_evidence_closure:
    package: app.workflows.import_evidence
    description: >
      Stage 4A.4.2 corrective closure. Persists versioned shipment quality
      assessments, importer aggregates, and audited shipment inclusions with
      deterministic fingerprints and current/history replacement. Produces no
      Company Signal and never invokes qualification or outreach.
    steps:
      - { id: persist_current_quality, service: import_evidence_persistence }
      - { id: compute_aggregate, service: import_evidence_aggregate }
      - { id: persist_aggregate_version, service: import_evidence_persistence }
    status: implemented

  mvp_prospect_analysis:
    package: app.workflows.mvp_prospect_analysis
    description: >
      Minimal synchronous browser facade (ADR-0024). Converts typed API input
      into existing Discovery and Contact claims. Each explicit real Company
      SourceReference is ingested before opportunity scoring; no provenance is
      fabricated. It then calls contact_ingestion, decision_maker and email in
      order. Each child retains its own Unit of Work; later failure returns
      PARTIAL and does not roll back committed upstream stages. Approval metadata
      is persisted on EmailDraft. Never sends email.
    steps:
      - { id: ingest_company, workflow: company_ingestion }
      - { id: assess_opportunity, workflow: opportunity }
      - { id: ingest_contact, workflow: contact_ingestion, optional: true }
      - { id: select_decision_maker, workflow: decision_maker, conditional: true }
      - { id: generate_email_draft, workflow: email, conditional: true }
    statuses: [COMPLETED, PARTIAL, REJECTED, FAILED]
    execution: sync
    status: implemented

  lead_generation:                   # aka "hunt" — main MVP pipeline
    package: app.workflows.lead_generation
    description: >
      Main MVP pipeline: from a user goal to a prioritized list of US
      importers with personalized outreach email drafts.
    steps:
      - id: plan
        agent: planner
        input: user_goal
      - id: research
        agent: research
        for_each: plan.targets       # fan-out per target company
        emits: [CompanyDiscovered, DiscoveryCompleted, DiscoveryFailed,
                CompanyFactsChanged, ImportRecordsUpdated]
      - id: score
        service: scoring
        input: research.analysis
        emits: [OpportunityScoreChanged, OpportunityQualified, OpportunityDisqualified]
      - id: draft_emails
        agent: sales
        input: [research.analysis, score.result]
        emits: [OutreachCreated, EmailDraftGenerated]
      - id: report
        agent: report
        input: all
    output: HuntReportSchema         # TBD
    execution: sync                  # Celery batch execution in a later sprint
    task_events: [TaskCompleted, TaskFailed]   # emitted by the Execution wrapper

  company_ingestion:
    package: app.workflows.company_ingestion
    description: >
      The Discovery → Company seam (ADR-0019): normalize a discovered
      claim, deduplicate (website host, then normalized name), create or merge the
      canonical Company. One UnitOfWork per event; rejection is an
      outcome, not an exception.
    consumes: [CompanyDiscovered]
    emits: [CompanyIngested]
    status: implemented          # invoked directly until the event bus lands

  opportunity:
    package: app.workflows.opportunity
    description: >
      The Company → Opportunity scoring seam (ADR-0020/0021): load company
      facts, call the replaceable OpportunityScoringService
      (mvp-explainable-scoring-v1 + mvp-qualification-policy-v1), create
      the opportunity or append an assessment (append-only; persisted
      SHA-256 fingerprint + DB unique constraint for idempotency; events
      drain only after successful commit). The workflow orchestrates; it
      never computes scores.
    consumes: [CompanyIngested, CompanyFactsChanged]
    emits: [OpportunityCreated, OpportunityAssessmentApplied]
    status: implemented          # invoked directly until the event bus lands

  contact_ingestion:
    package: app.workflows.contact_ingestion
    description: >
      The candidate → Contact seam (ADR-0022): normalize a contact claim
      (name/title/channels, role classification), deduplicate (email →
      linkedin → name+title; name-only conflicts go to POSSIBLE_MATCH for
      a human), create or merge. One UnitOfWork per event; events drain
      only after successful commit.
    consumes: [ContactCandidateDiscovered]
    emits: [ContactCreated, ContactUpdated, ContactChannelAdded,
            ContactChannelVerified, ContactInvalidated, ContactabilityChanged]
    status: implemented          # invoked directly until the event bus lands

  decision_maker:
    package: app.workflows.decision_maker
    description: >
      Rank a company's eligible contacts as logistics decision makers
      (mvp-decision-maker-policy-v1), persist append-only fit assessments,
      and select the outreach target. Never creates or sends drafts.
    emits: [DecisionMakerSelected]     # consumed by the email draft workflow (next lesson)
    status: implemented

  research:
    package: app.workflows.research
    description: On-demand deep-dive analysis of a single company.
    emits: [CompanyFactsChanged, ImportRecordsUpdated]
    status: planned

  email:
    package: app.workflows.email
    description: >
      MVP core chain's last hop (L11): QUALIFIED opportunity + ACTIVE
      contact → minimal EmailGenerationContext → EmailDraftGenerator
      (first-outreach-v1 prompt; fake or OpenAI adapter) → new draft
      version on the Outreach, GENERATED status, human review required.
      Context-fingerprint idempotent; never sends.
    emits: [EmailDraftGenerated]
    status: implemented          # invoked directly until the event bus lands

  followup:
    package: app.workflows.followup
    description: >
      Sequence follow-up emails based on CRM stage and time since last
      touch (uses domain/crm rules via the Opportunity aggregate).
    emits: [OutreachSent, OutreachReplied]
    consumes: [OutreachSent, OpportunityQualified]
    status: planned
