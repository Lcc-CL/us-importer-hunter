# Workflow specifications — v1 (Sprint 2 L3)
# Workflows orchestrate agents and services; see docs/workflow.md.
# Steps emit domain events (docs/business-domain.md) on the in-process
# EventBus (ADR-0004/0015); Execution context wraps every run in a Task.

workflows:
  discovery_task:
    package: app.workflows.discovery_task
    description: >
      D1 synchronous importer-discovery supervisor. Deterministically parses a
      Chinese goal, persists a generic execution Task plus DiscoveryTask detail,
      invokes one Company Discovery Provider, deduplicates candidates by domain
      then normalized name and address, and feeds non-duplicate claims through
      company_ingestion. Candidate failures are isolated and persisted. The
      default ImportYeti adapter fails closed until an official API contract is
      available; manual_csv is an explicitly labelled development adapter.
    steps:
      - { id: parse_prompt, service: discovery_prompt_parser }
      - { id: search_provider, provider: company_discovery_provider }
      - { id: normalize_deduplicate, service: discovery_candidate_preparation }
      - { id: ingest_companies, workflow: company_ingestion, for_each: candidate }
      - { id: persist_terminal_status, aggregate: discovery_task }
    statuses: [pending, running, completed, partial_failed, failed]
    execution: sync
    status: implemented

  import_evidence_closure:
    package: app.workflows.import_evidence
    description: >
      Stage 4A.4.2 corrective closure. Persists versioned shipment quality
      assessments, importer aggregates, and audited shipment inclusions with
      deterministic fingerprints and current/history replacement. Produces no
      Company Signal and never invokes qualification or outreach.
    steps:
      - { id: persist_current_quality, service: import_evidence_persistence }
      - { id: compute_aggregate, service: import_evidence_aggregate }
      - { id: persist_aggregate_version, service: import_evidence_persistence }
    status: implemented

  mvp_prospect_analysis:
    package: app.workflows.mvp_prospect_analysis
    description: >
      Minimal synchronous browser facade (ADR-0024). Converts typed API input
      into existing Discovery and Contact claims. Each explicit real Company
      SourceReference is ingested before opportunity scoring; no provenance is
      fabricated. It then calls contact_ingestion, decision_maker and email in
      order. Each child retains its own Unit of Work; later failure returns
      PARTIAL and does not roll back committed upstream stages. Approval metadata
      is persisted on EmailDraft. Never sends email.
    steps:
      - { id: ingest_company, workflow: company_ingestion }
      - { id: assess_opportunity, workflow: opportunity }
      - { id: ingest_contact, workflow: contact_ingestion, optional: true }
      - { id: select_decision_maker, workflow: decision_maker, conditional: true }
      - { id: generate_email_draft, workflow: email, conditional: true }
    statuses: [COMPLETED, PARTIAL, REJECTED, FAILED]
    execution: sync
    status: implemented

  lead_generation:                   # aka "hunt" — main MVP pipeline
    package: app.workflows.lead_generation
    description: >
      Main MVP pipeline: from a user goal to a prioritized list of US
      importers with personalized outreach email drafts.
    steps:
      - id: plan
        agent: planner
        input: user_goal
      - id: research
        agent: research
        for_each: plan.targets       # fan-out per target company
        emits: [CompanyDiscovered, DiscoveryCompleted, DiscoveryFailed,
                CompanyFactsChanged, ImportRecordsUpdated]
      - id: score
        service: scoring
        input: research.analysis
        emits: [OpportunityScoreChanged, OpportunityQualified, OpportunityDisqualified]
      - id: draft_emails
        agent: sales
        input: [research.analysis, score.result]
        emits: [OutreachCreated, EmailDraftGenerated]
      - id: report
        agent: report
        input: all
    output: HuntReportSchema         # TBD
    execution: sync                  # Celery batch execution in a later sprint
    task_events: [TaskCompleted, TaskFailed]   # emitted by the Execution wrapper

  company_ingestion:
    package: app.workflows.company_ingestion
    description: >
      The Discovery → Company seam (ADR-0019): normalize a discovered
      claim, deduplicate (website host, then normalized name), create or merge the
      canonical Company. One UnitOfWork per event; rejection is an
      outcome, not an exception.
    consumes: [CompanyDiscovered]
    emits: [CompanyIngested]
    status: implemented          # invoked directly until the event bus lands

  opportunity:
    package: app.workflows.opportunity
    description: >
      The Company → Opportunity scoring seam (ADR-0020/0021): load company
      facts, call the replaceable OpportunityScoringService
      (mvp-explainable-scoring-v1 + mvp-qualification-policy-v1), create
      the opportunity or append an assessment (append-only; persisted
      SHA-256 fingerprint + DB unique constraint for idempotency; events
      drain only after successful commit). The workflow orchestrates; it
      never computes scores.
    consumes: [CompanyIngested, CompanyFactsChanged]
    emits: [OpportunityCreated, OpportunityAssessmentApplied]
    status: implemented          # invoked directly until the event bus lands

  contact_ingestion:
    package: app.workflows.contact_ingestion
    description: >
      The candidate → Contact seam (ADR-0022): normalize a contact claim
      (name/title/channels, role classification), deduplicate (email →
      linkedin → name+title; name-only conflicts go to POSSIBLE_MATCH for
      a human), create or merge. One UnitOfWork per event; events drain
      only after successful commit.
    consumes: [ContactCandidateDiscovered]
    emits: [ContactCreated, ContactUpdated, ContactChannelAdded,
            ContactChannelVerified, ContactInvalidated, ContactabilityChanged]
    status: implemented          # invoked directly until the event bus lands

  decision_maker:
    package: app.workflows.decision_maker
    description: >
      Rank a company's eligible contacts as logistics decision makers
      (mvp-decision-maker-policy-v1), persist append-only fit assessments,
      and select the outreach target. Never creates or sends drafts.
    emits: [DecisionMakerSelected]     # consumed by the email draft workflow (next lesson)
    status: implemented

  research:
    package: app.workflows.research
    description: On-demand deep-dive analysis of a single company.
    emits: [CompanyFactsChanged, ImportRecordsUpdated]
    status: planned

  email:
    package: app.workflows.email
    description: >
      MVP core chain's last hop (L11): QUALIFIED opportunity + ACTIVE
      contact → minimal EmailGenerationContext → EmailDraftGenerator
      (first-outreach-v1 prompt; fake or OpenAI adapter) → new draft
      version on the Outreach, GENERATED status, human review required.
      Context-fingerprint idempotent; never sends.
    emits: [EmailDraftGenerated]
    status: implemented          # invoked directly until the event bus lands

  followup:
    package: app.workflows.followup
    description: >
      Sequence follow-up emails based on CRM stage and time since last
      touch (uses domain/crm rules via the Opportunity aggregate).
    emits: [OutreachSent, OutreachReplied]
    consumes: [OutreachSent, OpportunityQualified]
    status: planned
