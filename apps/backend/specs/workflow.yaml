# Workflow specifications — v1 (Sprint 2 L3)
# Workflows orchestrate agents and services; see docs/workflow.md.
# Steps emit domain events (docs/business-domain.md) on the in-process
# EventBus (ADR-0004/0015); Execution context wraps every run in a Task.

workflows:
  lead_generation:                   # aka "hunt" — main MVP pipeline
    package: app.workflows.lead_generation
    description: >
      Main MVP pipeline: from a user goal to a prioritized list of US
      importers with personalized outreach email drafts.
    steps:
      - id: plan
        agent: planner
        input: user_goal
      - id: research
        agent: research
        for_each: plan.targets       # fan-out per target company
        emits: [CompanyDiscovered, DiscoveryCompleted, DiscoveryFailed,
                CompanyFactsChanged, ImportRecordsUpdated]
      - id: score
        service: scoring
        input: research.analysis
        emits: [OpportunityScoreChanged, OpportunityQualified, OpportunityDisqualified]
      - id: draft_emails
        agent: sales
        input: [research.analysis, score.result]
        emits: [OutreachCreated, EmailDraftGenerated]
      - id: report
        agent: report
        input: all
    output: HuntReportSchema         # TBD
    execution: sync                  # Celery batch execution in a later sprint
    task_events: [TaskCompleted, TaskFailed]   # emitted by the Execution wrapper

  company_ingestion:
    package: app.workflows.company_ingestion
    description: >
      The Discovery → Company seam (ADR-0019): normalize a discovered
      claim, deduplicate (name, then website host), create or merge the
      canonical Company. One UnitOfWork per event; rejection is an
      outcome, not an exception.
    consumes: [CompanyDiscovered]
    emits: [CompanyIngested]
    status: implemented          # invoked directly until the event bus lands

  opportunity:
    package: app.workflows.opportunity
    description: >
      The Company → Opportunity scoring seam (ADR-0020/0021): load company
      facts, call the replaceable OpportunityScoringService
      (mvp-explainable-scoring-v1 + mvp-qualification-policy-v1), create
      the opportunity or append an assessment (append-only; persisted
      SHA-256 fingerprint + DB unique constraint for idempotency; events
      drain only after successful commit). The workflow orchestrates; it
      never computes scores.
    consumes: [CompanyIngested, CompanyFactsChanged]
    emits: [OpportunityCreated, OpportunityAssessmentApplied]
    status: implemented          # invoked directly until the event bus lands

  contact_ingestion:
    package: app.workflows.contact_ingestion
    description: >
      The candidate → Contact seam (ADR-0022): normalize a contact claim
      (name/title/channels, role classification), deduplicate (email →
      linkedin → name+title; name-only conflicts go to POSSIBLE_MATCH for
      a human), create or merge. One UnitOfWork per event; events drain
      only after successful commit.
    consumes: [ContactCandidateDiscovered]
    emits: [ContactCreated, ContactUpdated, ContactChannelAdded,
            ContactChannelVerified, ContactInvalidated, ContactabilityChanged]
    status: implemented          # invoked directly until the event bus lands

  decision_maker:
    package: app.workflows.decision_maker
    description: >
      Rank a company's eligible contacts as logistics decision makers
      (mvp-decision-maker-policy-v1), persist append-only fit assessments,
      and select the outreach target. Never creates or sends drafts.
    emits: [DecisionMakerSelected]     # consumed by the email draft workflow (next lesson)
    status: implemented

  research:
    package: app.workflows.research
    description: On-demand deep-dive analysis of a single company.
    emits: [CompanyFactsChanged, ImportRecordsUpdated]
    status: planned

  email:
    package: app.workflows.email
    description: Generate / regenerate outreach drafts from existing analysis.
    emits: [OutreachCreated, EmailDraftGenerated, EmailDraftApproved]
    status: planned

  followup:
    package: app.workflows.followup
    description: >
      Sequence follow-up emails based on CRM stage and time since last
      touch (uses domain/crm rules via the Opportunity aggregate).
    emits: [OutreachSent, OutreachReplied]
    consumes: [OutreachSent, OpportunityQualified]
    status: planned
