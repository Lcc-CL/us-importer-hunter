# Opportunity entity specification — v1 (Sprint 2 L3)
# Intelligence context. Opportunity is the JUDGMENT: worth pursuing, how
# much, why, and where the pursuit stands. The central value aggregate of
# the product (ADR-0015). Company facts live in company.yaml.

opportunity:
  judgment:
    score: { type: float, note: changes ONLY via rescore()/apply_outcome() — never assignment }
    confidence: { type: float, note: evidence QUALITY — distinct from completeness }
    data_completeness: { type: float, note: evidence COVERAGE — unknown lowers this, never the score }
    priority: { type: str, note: derived via versioned ScoringPolicy (thresholds are policy, not domain constants) — high / medium / low }
    qualification_decision: { type: str, note: "qualified | review | research_more | disqualified (mvp-qualification-policy-v1)" }
    reasons: { type: "list[str]", required: true, note: evidence-linked; never empty }
    recommended_action: { type: str, note: "policy-owned: prepare_outreach | human_review | collect_more_data | do_not_contact" }

  scoring_dimensions:   # weights sum to 100 — owned by DimensionWeights (L9, ADR-0021)
    import_activity: 20
    china_dependency: 15
    shipping_fit: 15
    cargo_value_potential: 10
    company_scale: 10
    growth_signal: 10
    contactability: 10
    logistics_complexity: 10

  status:
    stage: { type: str, note: "identified | scored | qualified | disqualified | contacted | engaged | negotiating | won | lost | dormant" }
    stage_reason: { type: str, note: required for won / lost / disqualified }

  assessment_history:          # append-only — no history entry, no score change
    entries:
      - old_score: { type: float }
        new_score: { type: float }
        confidence: { type: float }
        priority: { type: str, note: produced by the scoring service's policy }
        reasons: { type: "list[str]", note: never empty }
        evidence_refs: { type: "list[str]", note: source references / import record ids }
        recommended_action: { type: str }
        assessed_by: { type: str, note: which scorer produced this }
        data_completeness: { type: float }
        qualification_decision: { type: str }
        score_breakdown: { type: json, note: immutable audit snapshot of the 8-dimension decomposition }
        assessment_fingerprint: { type: str, required: true, note: SHA-256 over canonical judgment content; UNIQUE per opportunity }
        user_lens_version: { type: str }
        scoring_version: { type: str, note: "current placeholder: mvp-explainable-scoring-v1 — NOT for real sales decisions" }
        policy_version: { type: str, required: true, note: "mvp-qualification-policy-v1" }
        assessed_at: { type: datetime }

invariants:
  - Score changes only through domain behaviors; each change appends an assessment entry.
  - reasons is never empty — an unexplainable score is invalid.
  - Stage transitions follow the CRM machine (engaged requires a positive Outcome;
    won/lost require stage_reason; dormant only from contacted/engaged).
  - Scoring against a stale company profile caps confidence and flags the assessment.

relations:
  company: many-to-one          # the fact being judged (Discovery)
  user: many-to-one             # the lens (Identity) — same company, different users, different judgments
  outreaches: one-to-many       # pursuit conversations (Outreach context)

events:
  produces: [OpportunityScoreChanged, OpportunityQualified, OpportunityDisqualified,
             OpportunityWon, OpportunityLost]
  consumes: [CompanyIngested, CompanyFactsChanged, ImportRecordsUpdated, OutreachReplied]
