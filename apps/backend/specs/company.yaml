# Company entity specification — v1 (Sprint 2 L3)
# Discovery context. Company is a FACT: what is objectively knowable about
# a US importer. Judgment (score/priority/stage) lives in opportunity.yaml.
# Field-level source of truth across layers; finalized before migration.

company:
  identity:
    name: { type: str, required: true }
    normalized_name: { type: str, note: indexed candidate signal; not globally unique because reviewed companies may be kept separate }
    aliases: { type: "list[str]", note: names absorbed by merges }
    website: { type: url }
    country: { type: str, default: US }
    state: { type: str }
    city: { type: str }

  business:
    industry: { type: str }
    product_categories: { type: "list[str]" }
    hs_codes: { type: "list[str]" }
    employee_range: { type: str, note: TBD — depends on data source }

  logistics:                 # derived summary of ImportRecords — never hand-edited
    import_volume: { type: TBD, note: shipments/TEU per period — depends on source }
    origin_countries: { type: "list[str]" }
    lanes: { type: "list[str]", note: origin port → destination port }
    current_forwarders: { type: "list[str]", note: from BoL data if available }
    last_shipment_date: { type: date }

  signals:                   # switching hints derived from evidence
    volume_trend: { type: str, note: growing / stable / declining }
    cadence_gap: { type: bool, note: unusual pause in shipping rhythm }

  freshness:
    status: { type: str, note: "profiled | stale — stale profiles must not be scored as current" }
    enriched_at: { type: datetime }

  meta:
    sources: { type: "list[str]", note: which tools contributed data — every fact carries provenance }

invariants:
  - One company per real-world importer; merges preserve per-field source lineage.
  - Facts without provenance cannot enter the profile.
  - logistics section is always re-derivable from linked ImportRecords.
  - stale companies are excluded from current-scoring (confidence cap).

relations:
  import_records: one-to-many   # evidence (immutable, Discovery)
  contacts: many-to-many        # via CompanyContact; legacy Contact.company_id remains readable
  opportunities: one-to-many    # judgments about this company (Intelligence), per user/time
